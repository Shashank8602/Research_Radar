name: daily-digest

on:
  schedule:
    - cron: "0 22 * * *" # 03:30 IST. GitHub fires scheduled runs hours late at times (4.5h on 2026-10-17); the early slot lands the email by morning. The runs-table lock makes late or duplicate fires harmless.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no lock, no email)"
        type: boolean
        default: false

# Never run two digests at once.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: production
      GITHUB_TOKEN: ${{ github.token }}
      APP_RELEASE: ${{ github.sha }}
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      FEEDBACK_SIGNING_SECRET: ${{ secrets.FEEDBACK_SIGNING_SECRET }}
      FEEDBACK_BASE_URL: ${{ vars.FEEDBACK_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: uv sync --no-dev
      - name: Run pipeline
        run: uv run radar-run ${{ inputs.dry_run && '--dry-run' || '' }}
      # Storage retention runs after the digest and can never block it.
      - name: Clean up old data
        if: always() && !inputs.dry_run
        continue-on-error: true
        run: uv run radar-maintain
