name: evals

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 08:30 IST, with a small faithfulness sample
  pull_request:
    paths: ["src/radar/**", "topics.yaml"]
  workflow_dispatch:
    inputs:
      faithfulness:
        description: "LLM-check this many recent summaries for invented facts (0 = skip, spends tokens)"
        type: number
        default: 0

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: ci
      APP_RELEASE: ${{ github.sha }}
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      FAITHFULNESS_N: ${{ github.event_name == 'schedule' && '5' || inputs.faithfulness || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: uv sync --no-dev
      # Offline replay of stored scores + model-ID check; ranking thresholds apply only once
      # enough labels exist (topics.yaml `evals.min_labels_for_gate`).
      - name: Run evals
        run: uv run radar-eval --check-models --gate --faithfulness "$FAITHFULNESS_N"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/reports/latest.md
