[project]
name = "research-radar"
version = "0.1.0"
description = "Personal daily AI-research digest with feedback loop and grounded deep-dive."
readme = "research-radar.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "litellm>=1.50",
    "langfuse>=3.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pgvector>=0.3",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Temporary dev console (see plan.md, "Dev console"). Delete this group with devui/ in Phase 4.
devui = [
    "pandas>=2.2",
    "streamlit>=1.38",
]

[project.scripts]
radar-smoke = "radar.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "devui"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
