# Behavior lives here, not in code. See research-radar.md section 5.
models:                       # pinned, never "latest"; verified against provider lists
  embedding: BAAI/bge-small-en-v1.5   # 384-dim, CPU via FastEmbed
  judge: groq/openai/gpt-oss-120b
  fallbacks:
    - gemini/gemini-3.5-flash-lite      # 2.5-flash-lite was retired for new users (Oct 2026)
    - openrouter/nvidia/nemotron-3-super-120b-a12b:free

filter:
  top_n: 30
  recency_halflife_days: 3.0
  max_age_days: 14
  watchlist_window_days: 7
  weights: { cosine: 0.55, keyword: 0.20, recency: 0.15, popularity: 0.10, feedback: 0.0 }

dedupe:
  similarity_threshold: 0.92
  resend_window_days: 14

judge:
  batch_size: 6
  min_relevance: 4.0

diversify:
  mmr_lambda: 0.6          # lower = more variety in the top picks
  max_per_topic: 2         # at most 2 top picks from the same topic
  max_per_source: { github: 2 }   # new repos are recent and starred, so they would crowd out papers

personalize:               # vote-based ranking; off (0) until the evals show it helps (D-038)
  k: 5
  min_votes: 5
  final_blend: 0.0

retention:                 # storage clean-up by `radar-maintain` (D-044); digest/voted/labeled items are kept forever
  slim_after_days: 30        # drop abstract + embedding, keep title and link
  delete_after_days: 180     # then delete
  dry_run_keep_days: 14      # test runs
  token_grace_days: 7        # expired feedback links
  warn_db_mb: 400            # free tier is ~500 MB

evals:                     # thresholds for `radar-eval --gate` (D-042)
  min_labels_for_gate: 100
  min_precision_at_5: 0.5
  max_jargon_rate: 0.35
  max_reading_grade: 11      # Flesch-Kincaid grade; ~8 easy, 12 end of high school
  min_faithfulness: 0.85
  max_sameness_gap: 0.03     # writing must not make entries more alike than their sources (D-043)

digest:
  sections:
    core:        { max_items: 5 }
    watchlist:   { max_items: 2 }
    exploration: { max_items: 1 }

topics:
  - name: agentic-systems
    label: AI agents
    angle: how an AI plans multi-step work, chooses and uses tools, and hands work to other AIs
    scope_note: use only when the item is about HOW agents plan, use tools or coordinate; if agents are merely the setting, pick the more specific topic
    weight: 1.0
    description: >
      Designing, orchestrating and making reliable LLM agents: multi-agent patterns,
      planning, tool use, handoffs, and protocols like MCP and A2A.
    anchors:                   # real papers that define this topic (title + abstract); edit freely
      - "ReAct: Synergizing Reasoning and Acting in Language Models. While large language models (LLMs) have demonstrated impressive capabilities across tasks in language understanding and interactive decision making, their abilities for reasoning (e.g. chain-of-thought prompting) and acting (e.g. action plan generation) have primarily been studied as separate topics. In this paper, we explore the use of LLMs to generate both reasoning traces and task-specific actions in an interleaved manner, allowing for greater synergy between the two: reasoning traces help the model induce, track, and update action plans as well as handle exceptions, while actions allow it to interface with external sources, such as knowledge bases or environments, to gather additional in"  # https://arxiv.org/abs/2210.03629v3
      - "Toolformer: Language Models Can Teach Themselves to Use Tools. Language models (LMs) exhibit remarkable abilities to solve new tasks from just a few examples or textual instructions, especially at scale. They also, paradoxically, struggle with basic functionality, such as arithmetic or factual lookup, where much simpler and smaller models excel. In this paper, we show that LMs can teach themselves to use external tools via simple APIs and achieve the best of both worlds. We introduce Toolformer, a model trained to decide which APIs to call, when to call them, what arguments to pass, and how to best incorporate the results into future token prediction. This is done in a self-supervised way, requiring nothing more than a handful of demonstrations for each"  # https://arxiv.org/abs/2302.04761v1
      - "Why Do Multi-Agent LLM Systems Fail?. Despite enthusiasm for Multi-Agent LLM Systems (MAS), their performance gains on popular benchmarks are often minimal. This gap highlights a critical need for a principled understanding of why MAS fail. Addressing this question requires systematic identification and analysis of failure patterns. We introduce MAST-Data, a comprehensive dataset of 1600+ annotated traces collected across 7 popular MAS frameworks. MAST-Data is the first multi-agent system dataset to outline the failure dynamics in MAS for guiding the development of better future systems. To enable systematic classification of failures for MAST-Data, we build the first Multi-Agent System Failure Taxonomy (MAST). We develop MAST t"  # https://arxiv.org/abs/2503.13657v3
      - "AutoGen: Enabling Next-Gen LLM Applications via Multi-Agent Conversation. AutoGen is an open-source framework that allows developers to build LLM applications via multiple agents that can converse with each other to accomplish tasks. AutoGen agents are customizable, conversable, and can operate in various modes that employ combinations of LLMs, human inputs, and tools. Using AutoGen, developers can also flexibly define agent interaction behaviors. Both natural language and computer code can be used to program flexible conversation patterns for different applications. AutoGen serves as a generic infrastructure to build diverse applications of various complexities and LLM capacities. Empirical studies demonstrate the effectiveness of the framework in many example ap"  # https://arxiv.org/abs/2308.08155v2
    keywords: [agent, multi-agent, tool use, MCP, A2A, handoff]
    sources:
      arxiv: [cs.AI, cs.CL]
      hn_queries: ["agent", "MCP"]
      github_queries: ["agent skills", "MCP server", "AI agent framework", "claude code", "coding agent",
                       "multi-agent", "browser agent", "topic:claude-code", "topic:mcp", "topic:ai-agents"]

  - name: rag-retrieval
    label: AI that looks things up (RAG)
    angle: how an AI finds the right documents or facts, and whether its answer actually uses them
    weight: 1.0
    description: >
      Retrieval-augmented generation techniques: hybrid search, rerankers, GraphRAG,
      contextual retrieval, chunking strategies and multimodal retrieval.
    anchors:                   # real papers that define this topic (title + abstract); edit freely
      - "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks. Large pre-trained language models have been shown to store factual knowledge in their parameters, and achieve state-of-the-art results when fine-tuned on downstream NLP tasks. However, their ability to access and precisely manipulate knowledge is still limited, and hence on knowledge-intensive tasks, their performance lags behind task-specific architectures. Additionally, providing provenance for their decisions and updating their world knowledge remain open research problems. Pre-trained models with a differentiable access mechanism to explicit non-parametric memory can overcome this issue, but have so far been only investigated for extractive downstream tasks. We explore a general-purpose "  # https://arxiv.org/abs/2005.11401v4
      - "Self-RAG: Learning to Retrieve, Generate, and Critique through Self-Reflection. Despite their remarkable capabilities, large language models (LLMs) often produce responses containing factual inaccuracies due to their sole reliance on the parametric knowledge they encapsulate. Retrieval-Augmented Generation (RAG), an ad hoc approach that augments LMs with retrieval of relevant knowledge, decreases such issues. However, indiscriminately retrieving and incorporating a fixed number of retrieved passages, regardless of whether retrieval is necessary, or passages are relevant, diminishes LM versatility or can lead to unhelpful response generation. We introduce a new framework called Self-Reflective Retrieval-Augmented Generation (Self-RAG) that enhances an LM's quality and fa"  # https://arxiv.org/abs/2310.11511v1
      - "From Local to Global: A Graph RAG Approach to Query-Focused Summarization. The use of retrieval-augmented generation (RAG) to retrieve relevant information from an external knowledge source enables large language models (LLMs) to answer questions over private and/or previously unseen document collections. However, RAG fails on global questions directed at an entire text corpus, such as \"What are the main themes in the dataset?\", since this is inherently a query-focused summarization (QFS) task, rather than an explicit retrieval task. Prior QFS methods, meanwhile, do not scale to the quantities of text indexed by typical RAG systems. To combine the strengths of these contrasting methods, we propose GraphRAG, a graph-based approach to question answering over private "  # https://arxiv.org/abs/2404.16130v2
      - "Lost in the Middle: How Language Models Use Long Contexts. While recent language models have the ability to take long contexts as input, relatively little is known about how well they use longer context. We analyze the performance of language models on two tasks that require identifying relevant information in their input contexts: multi-document question answering and key-value retrieval. We find that performance can degrade significantly when changing the position of relevant information, indicating that current language models do not robustly make use of information in long input contexts. In particular, we observe that performance is often highest when relevant information occurs at the beginning or end of the input context, and significantly de"  # https://arxiv.org/abs/2307.03172v3
    keywords: [RAG, retrieval, reranker, GraphRAG, chunking, hybrid search]
    sources:
      arxiv: [cs.IR, cs.CL]
      hn_queries: ["RAG", "reranker"]
      github_queries: ["RAG", "reranker"]

  - name: llmops-evals
    label: Testing and monitoring AI
    angle: how you measure whether an AI works, watch it in use, and control its cost and speed
    weight: 1.0
    description: >
      Evaluating, monitoring and operating LLM applications: LLM-as-judge, eval frameworks
      and benchmarks, tracing and observability, cost and latency optimization, prompt caching.
    anchors:                   # real papers that define this topic (title + abstract); edit freely
      - "Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena. Evaluating large language model (LLM) based chat assistants is challenging due to their broad capabilities and the inadequacy of existing benchmarks in measuring human preferences. To address this, we explore using strong LLMs as judges to evaluate these models on more open-ended questions. We examine the usage and limitations of LLM-as-a-judge, including position, verbosity, and self-enhancement biases, as well as limited reasoning ability, and propose solutions to mitigate some of them. We then verify the agreement between LLM judges and human preferences by introducing two benchmarks: MT-bench, a multi-turn question set; and Chatbot Arena, a crowdsourced battle platform. Our results revea"  # https://arxiv.org/abs/2306.05685v4
      - "Ragas: Automated Evaluation of Retrieval Augmented Generation. We introduce Ragas (Retrieval Augmented Generation Assessment), a framework for reference-free evaluation of Retrieval Augmented Generation (RAG) pipelines. RAG systems are composed of a retrieval and an LLM based generation module, and provide LLMs with knowledge from a reference textual database, which enables them to act as a natural language layer between a user and textual databases, reducing the risk of hallucinations. Evaluating RAG architectures is, however, challenging because there are several dimensions to consider: the ability of the retrieval system to identify relevant and focused context passages, the ability of the LLM to exploit such passages in a faithful way, or the qualit"  # https://arxiv.org/abs/2309.15217v2
      - "G-Eval: NLG Evaluation using GPT-4 with Better Human Alignment. The quality of texts generated by natural language generation (NLG) systems is hard to measure automatically. Conventional reference-based metrics, such as BLEU and ROUGE, have been shown to have relatively low correlation with human judgments, especially for tasks that require creativity and diversity. Recent studies suggest using large language models (LLMs) as reference-free metrics for NLG evaluation, which have the benefit of being applicable to new tasks that lack human references. However, these LLM-based evaluators still have lower human correspondence than medium-size neural evaluators. In this work, we present G-Eval, a framework of using large language models with chain-of-thought"  # https://arxiv.org/abs/2303.16634v3
      - "SWE-bench: Can Language Models Resolve Real-World GitHub Issues?. Language models have outpaced our ability to evaluate them effectively, but for their future development it is essential to study the frontier of their capabilities. We find real-world software engineering to be a rich, sustainable, and challenging testbed for evaluating the next generation of language models. To this end, we introduce SWE-bench, an evaluation framework consisting of $2,294$ software engineering problems drawn from real GitHub issues and corresponding pull requests across $12$ popular Python repositories. Given a codebase along with a description of an issue to be resolved, a language model is tasked with editing the codebase to address the issue. Resolving issues in SWE-ben"  # https://arxiv.org/abs/2310.06770v3
    keywords: [LLM-as-judge, evaluation, benchmark, observability, tracing, prompt caching, latency, cost]
    sources:
      arxiv: [cs.CL, cs.AI]
      hn_queries: ["LLM eval", "observability LLM"]
      github_queries: ["LLM evaluation", "LLM observability"]

  - name: memory-context
    label: AI memory
    angle: what an AI remembers, forgets, summarizes or keeps in view across a long task or many conversations
    weight: 1.0
    description: >
      How agents store, retrieve and compress state across sessions: long-term memory,
      context engineering, compaction, summarization of history, and memory benchmarks.
    anchors:                   # real papers that define this topic (title + abstract); edit freely
      - "MemGPT: Towards LLMs as Operating Systems. Large language models (LLMs) have revolutionized AI, but are constrained by limited context windows, hindering their utility in tasks like extended conversations and document analysis. To enable using context beyond limited context windows, we propose virtual context management, a technique drawing inspiration from hierarchical memory systems in traditional operating systems that provide the appearance of large memory resources through data movement between fast and slow memory. Using this technique, we introduce MemGPT (Memory-GPT), a system that intelligently manages different memory tiers in order to effectively provide extended context within the LLM's limited context window, and utilize"  # https://arxiv.org/abs/2310.08560v2
      - "Generative Agents: Interactive Simulacra of Human Behavior. Believable proxies of human behavior can empower interactive applications ranging from immersive environments to rehearsal spaces for interpersonal communication to prototyping tools. In this paper, we introduce generative agents--computational software agents that simulate believable human behavior. Generative agents wake up, cook breakfast, and head to work; artists paint, while authors write; they form opinions, notice each other, and initiate conversations; they remember and reflect on days past as they plan the next day. To enable generative agents, we describe an architecture that extends a large language model to store a complete record of the agent's experiences using natural languag"  # https://arxiv.org/abs/2304.03442v2
      - "Reflexion: Language Agents with Verbal Reinforcement Learning. Large language models (LLMs) have been increasingly used to interact with external environments (e.g., games, compilers, APIs) as goal-driven agents. However, it remains challenging for these language agents to quickly and efficiently learn from trial-and-error as traditional reinforcement learning methods require extensive training samples and expensive model fine-tuning. We propose Reflexion, a novel framework to reinforce language agents not by updating weights, but instead through linguistic feedback. Concretely, Reflexion agents verbally reflect on task feedback signals, then maintain their own reflective text in an episodic memory buffer to induce better decision-making in subsequent t"  # https://arxiv.org/abs/2303.11366v4
      - "Mem0: Building Production-Ready AI Agents with Scalable Long-Term Memory. Large Language Models (LLMs) have demonstrated remarkable prowess in generating contextually coherent responses, yet their fixed context windows pose fundamental challenges for maintaining consistency over prolonged multi-session dialogues. We introduce Mem0, a scalable memory-centric architecture that addresses this issue by dynamically extracting, consolidating, and retrieving salient information from ongoing conversations. Building on this foundation, we further propose an enhanced variant that leverages graph-based memory representations to capture complex relational structures among conversational elements. Through comprehensive evaluations on LOCOMO benchmark, we systematically compare"  # https://arxiv.org/abs/2504.19413v1
    keywords: [agent memory, long-term memory, context engineering, context window, compaction, memory benchmark]
    sources:
      arxiv: [cs.CL, cs.AI]
      hn_queries: ["agent memory", "context engineering"]
      github_queries: ["agent memory", "context engineering"]

  - name: agent-security
    label: AI safety and security
    angle: how an AI can be attacked, misused or go wrong, and what defends against it
    weight: 1.0
    description: >
      Securing LLM agents: prompt injection and jailbreak defenses, tool-permission design,
      sandboxing, guardrail frameworks and red-teaming of agentic systems.
    anchors:                   # real papers that define this topic (title + abstract); edit freely
      - "AgentDojo: A Dynamic Environment to Evaluate Prompt Injection Attacks and Defenses for LLM Agents. AI agents aim to solve complex tasks by combining text-based reasoning with external tool calls. Unfortunately, AI agents are vulnerable to prompt injection attacks where data returned by external tools hijacks the agent to execute malicious tasks. To measure the adversarial robustness of AI agents, we introduce AgentDojo, an evaluation framework for agents that execute tools over untrusted data. To capture the evolving nature of attacks and defenses, AgentDojo is not a static test suite, but rather an extensible environment for designing and evaluating new agent tasks, defenses, and adaptive attacks. We populate the environment with 97 realistic tasks (e.g., managing an email client, naviga"  # https://arxiv.org/abs/2406.13352v3
      - "Universal and Transferable Adversarial Attacks on Aligned Language Models. Because \"out-of-the-box\" large language models are capable of generating a great deal of objectionable content, recent work has focused on aligning these models in an attempt to prevent undesirable generation. While there has been some success at circumventing these measures -- so-called \"jailbreaks\" against LLMs -- these attacks have required significant human ingenuity and are brittle in practice. In this paper, we propose a simple and effective attack method that causes aligned language models to generate objectionable behaviors. Specifically, our approach finds a suffix that, when attached to a wide range of queries for an LLM to produce objectionable content, aims to maximize the probab"  # https://arxiv.org/abs/2307.15043v2
      - "Defeating Prompt Injections by Design. Large Language Models (LLMs) are increasingly deployed in agentic systems that interact with an untrusted environment. However, LLM agents are vulnerable to prompt injection attacks when handling untrusted data. In this paper we propose CaMeL, a robust defense that creates a protective system layer around the LLM, securing it even when underlying models are susceptible to attacks. To operate, CaMeL explicitly extracts the control and data flows from the (trusted) query; therefore, the untrusted data retrieved by the LLM can never impact the program flow. To further improve security, CaMeL uses a notion of a capability to prevent the exfiltration of private data over unauthorized data flows b"  # https://arxiv.org/abs/2503.18813v2
    keywords: [prompt injection, jailbreak, guardrail, sandbox, red teaming, tool permission, agent security]
    sources:
      arxiv: [cs.CR, cs.AI, cs.CL]
      hn_queries: ["prompt injection", "agent security"]
      github_queries: ["prompt injection", "AI agent security", "reverse engineering", "jailbreak"]

  - name: enterprise-genai
    label: AI in real companies
    angle: "what a real team learned when putting AI into production: what broke, what it cost, what they changed"
    weight: 1.0
    description: >
      Case studies, architecture write-ups and lessons from teams shipping RAG and agents to
      production at scale: reliability, cost, deployment, and organizational lessons.
    anchors:                   # real papers that define this topic (title + abstract); edit freely
      - "Seven Failure Points When Engineering a Retrieval Augmented Generation System. Software engineers are increasingly adding semantic search capabilities to applications using a strategy known as Retrieval Augmented Generation (RAG). A RAG system involves finding documents that semantically match a query and then passing the documents to a large language model (LLM) such as ChatGPT to extract the right answer using an LLM. RAG systems aim to: a) reduce the problem of hallucinated responses from LLMs, b) link sources/references to generated responses, and c) remove the need for annotating documents with meta-data. However, RAG systems suffer from limitations inherent to information retrieval systems and from reliance on LLMs. In this paper, we present an experience report "  # https://arxiv.org/abs/2401.05856v1
      - "Retrieval-Augmented Generation for Large Language Models: A Survey. Large Language Models (LLMs) showcase impressive capabilities but encounter challenges like hallucination, outdated knowledge, and non-transparent, untraceable reasoning processes. Retrieval-Augmented Generation (RAG) has emerged as a promising solution by incorporating knowledge from external databases. This enhances the accuracy and credibility of the generation, particularly for knowledge-intensive tasks, and allows for continuous knowledge updates and integration of domain-specific information. RAG synergistically merges LLMs' intrinsic knowledge with the vast, dynamic repositories of external databases. This comprehensive review paper offers a detailed examination of the progression of "  # https://arxiv.org/abs/2312.10997v5
    keywords: [in production, case study, lessons learned, at scale, deployment, enterprise]
    sources:
      arxiv: []
      hn_queries: ["LLM in production", "lessons learned LLM"]
      github_queries: ["LLM gateway"]

