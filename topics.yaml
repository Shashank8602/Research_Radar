# Behavior lives here, not in code. See research-radar.md section 5.
models:                       # pinned, never "latest"; verified against provider lists
  embedding: BAAI/bge-small-en-v1.5   # 384-dim, CPU via FastEmbed
  judge: groq/openai/gpt-oss-120b
  fallbacks:
    - gemini/gemini-2.5-flash-lite
    - openrouter/nvidia/nemotron-3-super-120b-a12b:free

filter:
  top_n: 30
  recency_halflife_days: 3.0
  max_age_days: 14
  watchlist_window_days: 7
  weights: { cosine: 0.55, keyword: 0.20, recency: 0.15, popularity: 0.10, feedback: 0.0 }

dedupe:
  similarity_threshold: 0.92
  resend_window_days: 14

judge:
  batch_size: 6
  min_relevance: 4.0

diversify:
  mmr_lambda: 0.7

digest:
  sections:
    core:        { max_items: 5 }
    watchlist:   { max_items: 2 }
    exploration: { max_items: 1 }

topics:
  - name: agentic-systems
    weight: 1.0
    description: >
      Designing, orchestrating and making reliable LLM agents: multi-agent patterns,
      planning, tool use, handoffs, and protocols like MCP and A2A.
    anchors: []               # 5-10 seed URLs, to be added
    keywords: [agent, multi-agent, tool use, MCP, A2A, handoff]
    sources:
      arxiv: [cs.AI, cs.CL]
      hn_queries: ["agent", "MCP"]

  - name: rag-retrieval
    weight: 1.0
    description: >
      Retrieval-augmented generation techniques: hybrid search, rerankers, GraphRAG,
      contextual retrieval, chunking strategies and multimodal retrieval.
    anchors: []
    keywords: [RAG, retrieval, reranker, GraphRAG, chunking, hybrid search]
    sources:
      arxiv: [cs.IR, cs.CL]
      hn_queries: ["RAG", "reranker"]

  - name: llmops-evals
    weight: 1.0
    description: >
      Evaluating, monitoring and operating LLM applications: LLM-as-judge, eval frameworks
      and benchmarks, tracing and observability, cost and latency optimization, prompt caching.
    anchors: []
    keywords: [LLM-as-judge, evaluation, benchmark, observability, tracing, prompt caching, latency, cost]
    sources:
      arxiv: [cs.CL, cs.AI]
      hn_queries: ["LLM eval", "observability LLM"]

  - name: memory-context
    weight: 1.0
    description: >
      How agents store, retrieve and compress state across sessions: long-term memory,
      context engineering, compaction, summarization of history, and memory benchmarks.
    anchors: []
    keywords: [agent memory, long-term memory, context engineering, context window, compaction, memory benchmark]
    sources:
      arxiv: [cs.CL, cs.AI]
      hn_queries: ["agent memory", "context engineering"]

  - name: agent-security
    weight: 1.0
    description: >
      Securing LLM agents: prompt injection and jailbreak defenses, tool-permission design,
      sandboxing, guardrail frameworks and red-teaming of agentic systems.
    anchors: []
    keywords: [prompt injection, jailbreak, guardrail, sandbox, red teaming, tool permission, agent security]
    sources:
      arxiv: [cs.CR, cs.AI, cs.CL]
      hn_queries: ["prompt injection", "agent security"]

  - name: enterprise-genai
    weight: 1.0
    description: >
      Case studies, architecture write-ups and lessons from teams shipping RAG and agents to
      production at scale: reliability, cost, deployment, and organizational lessons.
    anchors: []
    keywords: [in production, case study, lessons learned, at scale, deployment, enterprise]
    sources:
      arxiv: []
      hn_queries: ["LLM in production", "lessons learned LLM"]

global_sources:
  hf_daily_papers: true
  rss:
    - { name: Simon Willison, feed: "https://simonwillison.net/atom/everything/" }

watchlist:
  - { name: LangGraph, feed: "https://github.com/langchain-ai/langgraph/releases.atom" }
  - { name: LiteLLM,   feed: "https://github.com/BerriAI/litellm/releases.atom" }
  - { name: Langfuse,  feed: "https://github.com/langfuse/langfuse/releases.atom" }
  - { name: Mem0,      feed: "https://github.com/mem0ai/mem0/releases.atom" }
